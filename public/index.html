<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 6500px;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h2>Video en Vivo</h2>
    <video id="video-player" autoplay muted ></video>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video-player');
            const streamUrl = '/stream/output.m3u8';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                });
            }
            // For browsers with native HLS support (Safari/iOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        });
    </script>



    <h2>Datos Meteorológicos</h2>
    <iframe id="weather-frame"></iframe>

    <script>
        // Cargar la URL desde el servidor
        fetch('/api/weather-url')
            .then(response => response.json())
            .then(data => {
                document.getElementById('weather-frame').src = data.url;
            })
            .catch(error => {
                console.error('Error al cargar la URL:', error);
            });
    </script>

</body>

</html>
